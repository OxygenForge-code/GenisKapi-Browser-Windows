<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenişKapı • Eklenti uyumluluğu</title>
<style>
:root{color-scheme:dark;--bg:#060b13;--panel:#0d1725;--panel2:#111f31;--line:#263a55;--text:#f3f7ff;--muted:#8495ac;--accent:#82aaff;--danger:#ff7684}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,system-ui,sans-serif;background:transparent;color:var(--text)}
body{display:grid;place-items:center}.backdrop{position:absolute;inset:0;background:radial-gradient(circle at 50% 10%,rgba(92,125,185,.18),transparent 55%),rgba(4,8,14,.88);animation:fade .25s ease-out both}
.dialog{position:relative;width:min(470px,92vw);padding:28px;border:1px solid rgba(106,140,188,.28);border-radius:24px;background:linear-gradient(180deg,rgba(17,29,45,.98),rgba(10,18,29,.98));box-shadow:0 32px 100px rgba(0,0,0,.62),inset 0 1px rgba(255,255,255,.04);animation:dialogIn .45s cubic-bezier(.16,1,.3,1) both;overflow:hidden}.dialog:before{content:"";position:absolute;inset:-1px;background:linear-gradient(120deg,transparent 10%,rgba(130,170,255,.09),transparent 65%);background-size:220% 100%;animation:shine 3s linear infinite;pointer-events:none}
.icon{position:relative;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin-bottom:20px;background:rgba(255,118,132,.09);border:1px solid rgba(255,118,132,.2);box-shadow:0 0 0 8px rgba(255,118,132,.03);animation:iconIn .58s cubic-bezier(.175,.885,.32,1.275) .08s both}.icon svg{width:30px;height:30px;stroke:var(--danger);animation:iconPulse 2s ease-in-out .8s infinite}
h1{position:relative;margin:0;font-size:23px;letter-spacing:-.45px}p{position:relative;margin:10px 0 0;color:var(--muted);line-height:1.62;font-size:13px}.reason{position:relative;margin:18px 0 0;padding:13px 14px;border:1px solid rgba(114,143,181,.16);border-radius:14px;background:rgba(7,13,22,.48);color:#9aa9bd;font-size:11px;line-height:1.55;max-height:74px;overflow:auto}.actions{position:relative;display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.btn{height:37px;padding:0 15px;border-radius:11px;border:1px solid #2b405d;background:#152238;color:#dce8f7;cursor:pointer;font-weight:700;transition:.18s}.btn:hover{transform:translateY(-1px);background:#1a2c45}.btn.primary{background:#dce9ff;border-color:#dce9ff;color:#142238}.btn.primary:hover{background:#edf4ff;box-shadow:0 8px 24px rgba(128,171,241,.18)}
.small{position:relative;margin-top:13px;color:#596a81;font-size:10px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes dialogIn{from{opacity:0;transform:translateY(14px) scale(.96)}60%{opacity:1;transform:translateY(-2px) scale(1.01)}to{transform:none}}@keyframes iconIn{from{opacity:0;transform:scale(.68) rotate(-12deg)}65%{opacity:1;transform:scale(1.08) rotate(2deg)}to{transform:none}}@keyframes iconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes shine{from{background-position:220% 0}to{background-position:-120% 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="backdrop"></div>
<section class="dialog" role="dialog" aria-modal="true">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M12 3 21 20H3L12 3Z"/><path d="M12 9v5"/><path d="M12 17.4h.01"/></svg></div>
  <h1 id="title">Bu eklenti GenişKapı Browser ile uyumlu değil</h1>
  <p id="message">Uzantı indirildi ancak GenişKapı'nın desteklediği Chromium eklenti ortamına yüklenemedi.</p>
  <div class="reason" id="reason">Uyumluluk denetimi başarısız.</div>
  <div class="actions"><button class="btn" id="details">Detayı kopyala</button><button class="btn primary" id="close">Kapat</button></div>
  <div class="small">Eklenti kaldırıldı ve yarım kalan kurulum temizlendi.</div>
</section>
<script>
const p=new URLSearchParams(location.search);const name=p.get('name');const reason=p.get('reason');
if(name)document.getElementById('title').textContent=`${name} GenişKapı Browser ile uyumlu değil`;
if(reason)document.getElementById('reason').textContent=reason;
function close(){window.close()}
document.getElementById('close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter')close()});
document.getElementById('details').onclick=async()=>{const text=(document.getElementById('title').textContent+'\n'+document.getElementById('reason').textContent);try{await navigator.clipboard.writeText(text);document.getElementById('details').textContent='Kopyalandı ✓'}catch{document.getElementById('details').textContent='Kopyalanamadı'}};
</script>
</body>
</html>
