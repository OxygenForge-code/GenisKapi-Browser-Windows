<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenişKapı • İndirmeler</title><style>body{margin:0;background:#07101b;color:#eef4fc;font:14px system-ui;padding:32px}h1{margin:0 0 8px;font-size:28px}.sub{color:#8091a8;margin-bottom:24px}.item{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid #1b2d43;background:#0d1826;border-radius:14px;margin:9px 0}.icon{width:40px;height:40px;border-radius:12px;background:#172a43;display:grid;place-items:center}.copy{flex:1;min-width:0}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:#71849c;font-size:12px;margin-top:5px}.empty{color:#71849c;padding:40px;text-align:center}</style></head><body><h1>İndirmeler</h1><div class="sub">GenişKapı üzerinden indirilen dosyalar.</div><main id="list"><div class="empty">İndirme geçmişi bu oturumda oluştuğunda burada görünecek.</div></main><script>async function render(){const data=await window.geniskapi.downloadsList();document.querySelector('#list').innerHTML=data.length?data.map(x=>`<article class="item"><div class="icon">↓</div><div class="copy"><div class="name">${esc(x.filename||'Dosya')}</div><div class="meta">${esc(x.state||'Başlatıldı')} · ${esc(x.path||'')}</div></div></article>`).join(''):'<div class="empty">Henüz indirme yok.</div>'}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}render();setInterval(render,1500);</script></body></html>
