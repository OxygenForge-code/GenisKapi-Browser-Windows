<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenişKapı • Eklentiler</title><style>body{margin:0;background:#07101b;color:#eef4fc;font:14px system-ui;padding:32px}h1{margin:0 0 8px;font-size:28px}.sub{color:#8091a8;margin-bottom:24px}.item{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid #1b2d43;background:#0d1826;border-radius:14px;margin:9px 0}.icon{width:42px;height:42px;border-radius:12px;background:#172a43;display:grid;place-items:center;font-weight:800}.copy{flex:1}.name{font-weight:700}.meta{color:#71849c;font-size:12px;margin-top:5px}.empty{color:#71849c;padding:40px;text-align:center}.store{background:#dceaff;color:#12223a}</style></head><body><h1>Eklentiler</h1><div class="sub">GenişKapı'ya yüklenmiş Chrome Web Store eklentilerini yönet.</div><main id="list"></main><script>async function render(){const data=await window.geniskapi.extensionsList();document.querySelector('#list').innerHTML=data.length?data.map(x=>`<article class="item"><div class="icon">E</div><div class="copy"><div class="name">${esc(x.name)}</div><div class="meta">v${esc(x.version)} · Manifest ${esc(x.manifestVersion)}</div></div></article>`).join(''):'<div class="empty">Henüz yüklenmiş eklenti yok.<br><br><button class="store" onclick="window.geniskapi.navigate(\'https://chromewebstore.google.com/\')">Chrome Web Store'u aç</button></div>'}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}render();</script></body></html>
