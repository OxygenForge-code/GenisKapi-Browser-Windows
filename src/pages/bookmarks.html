<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenişKapı • Yer İmleri</title><style>body{margin:0;background:#07101b;color:#eef4fc;font:14px system-ui;padding:32px}h1{margin:0 0 8px;font-size:28px}.sub{color:#8091a8;margin-bottom:24px}.item{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid #1b2d43;background:#0d1826;border-radius:14px;margin:9px 0}.fav{width:38px;height:38px;border-radius:11px;background:#172a43;display:grid;place-items:center}.copy{flex:1;min-width:0}.title{font-weight:700}.url{color:#71849c;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.open{background:#dceaff;color:#12223a}.remove{color:#ff8d9a}.empty{color:#71849c;padding:40px;text-align:center}</style></head><body><h1>Yer İmleri</h1><div class="sub">Kaydettiğin sayfalara hızlıca dön.</div><main id="list"></main><script>async function render(){const data=await window.geniskapi.bookmarksList();document.querySelector('#list').innerHTML=data.length?data.map(x=>`<article class="item"><div class="fav">★</div><div class="copy"><div class="title">${esc(x.title)}</div><div class="url">${esc(x.url)}</div></div><button class="open" data-url="${encodeURIComponent(x.url)}">Aç</button><button class="remove" data-url="${encodeURIComponent(x.url)}">Sil</button></article>`).join(''):'<div class="empty">Henüz yer imi yok.</div>';document.querySelectorAll('.open').forEach(b=>b.onclick=()=>window.geniskapi.navigate(decodeURIComponent(b.dataset.url)));document.querySelectorAll('.remove').forEach(b=>b.onclick=async()=>{await window.geniskapi.bookmarkRemove(decodeURIComponent(b.dataset.url));render()})}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}render();</script></body></html>
