<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenişKapı • Geçmiş</title><style>body{margin:0;background:#07101b;color:#eef4fc;font:14px system-ui;padding:32px}h1{margin:0 0 8px;font-size:28px}.sub{color:#8091a8;margin-bottom:24px}.bar{display:flex;gap:10px;margin-bottom:20px}input{flex:1;padding:13px 15px;border-radius:12px;border:1px solid #29405d;background:#0e1a29;color:white;outline:0}button{border:0;border-radius:11px;padding:11px 15px;background:#1a2d45;color:#dce9fb;cursor:pointer}button:hover{background:#243d5d}.item{padding:15px;border:1px solid #1b2d43;background:#0d1826;border-radius:14px;margin:9px 0}.title{font-weight:700}.url,.time{color:#71849c;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{color:#71849c;padding:40px;text-align:center}</style></head><body><h1>Geçmiş</h1><div class="sub">Gezdiğin sayfalar burada saklanır.</div><div class="bar"><input id="q" placeholder="Geçmişte ara…"><button id="clear">Geçmişi temizle</button></div><main id="list"></main><script>const q=document.querySelector('#q'),list=document.querySelector('#list');async function render(){const data=await window.geniskapi.historyList(q.value);list.innerHTML=data.length?data.map(x=>`<article class="item" data-url="${encodeURIComponent(x.url)}"><div class="title">${esc(x.title)}</div><div class="url">${esc(x.url)}</div><div class="time">${new Date(x.timestamp).toLocaleString('tr-TR')}</div></article>`).join(''):'<div class="empty">Henüz geçmiş kaydı yok.</div>';document.querySelectorAll('.item').forEach(e=>e.onclick=()=>window.geniskapi.navigate(decodeURIComponent(e.dataset.url)))}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}q.oninput=render;document.querySelector('#clear').onclick=async()=>{await window.geniskapi.historyClear();render()};render();</script></body></html>
