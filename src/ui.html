<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>GenişKapı</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}.bar{height:96px;background:#0b1728;border-bottom:1px solid #1b2a40;padding:12px 14px 10px}.tabs{height:34px;display:flex;gap:6px;align-items:center}.tab{background:#132238;border:1px solid #20344f;border-radius:9px 9px 0 0;padding:7px 16px;min-width:180px}.brand{font-weight:750;letter-spacing:.2px}.tools{display:flex;gap:8px;align-items:center}.btn{border:0;background:#132238;color:#dce8f8;border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer}.btn:hover{background:#1b304d}.address{flex:1;height:34px;background:#101f34;border:1px solid #253955;border-radius:10px;color:#edf5ff;padding:0 14px;outline:0}.address:focus{border-color:#557aa9}.new{font-size:22px}.hint{opacity:.55;font-size:12px;padding-left:4px}</style></head><body><div class="bar"><div class="tabs"><div class="tab"><span class="brand">GenişKapı</span><span id="tabTitle"> · Yeni sekme</span></div><button class="btn new" id="new">+</button></div><div class="tools"><button class="btn" id="back">‹</button><button class="btn" id="forward">›</button><button class="btn" id="reload">↻</button><button class="btn" id="home">⌂</button><input class="address" id="address" spellcheck="false" placeholder="Web'de ara veya adres gir"><button class="btn" id="go">→</button></div></div><script>const $=id=>document.getElementById(id);$('go').onclick=()=>window.geniskapi.navigate($('address').value);$('address').addEventListener('keydown',e=>{if(e.key==='Enter')window.geniskapi.navigate(e.target.value)});$('back').onclick=()=>window.geniskapi.back();$('forward').onclick=()=>window.geniskapi.forward();$('reload').onclick=()=>window.geniskapi.reload();$('home').onclick=()=>window.geniskapi.home();$('new').onclick=()=>window.geniskapi.newWindow();window.geniskapi.onUrl(url=>{$('address').value=url;$('tabTitle').textContent=' · '+new URL(url).hostname});</script></body></html>
