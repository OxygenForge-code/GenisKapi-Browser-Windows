<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenişKapı Browser</title><style>:root{color-scheme:dark;--bg:#07101d;--chrome:#0a1524;--chrome2:#0d1a2c;--surface:#111f32;--surface2:#16263d;--line:#20334d;--muted:#8fa1b8;--text:#f2f6fc;--accent:#73a7ff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.2 Inter,Segoe UI,system-ui,-apple-system,sans-serif;overflow:hidden}.chrome{height:96px;background:linear-gradient(180deg,#0b1728 0%,#0a1422 100%);border-bottom:1px solid #17273d;padding:7px 10px 10px;box-shadow:0 5px 18px rgba(0,0,0,.18)}.top{height:35px;display:flex;align-items:end;gap:6px}.brand{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;color:#eaf2ff;font-weight:750;letter-spacing:.1px;white-space:nowrap}.brandmark{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:linear-gradient(135deg,#8db7ff,#4e7fd0);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 4px 12px rgba(82,133,214,.22)}.brandmark svg{width:13px;height:13px}.tab{height:34px;min-width:220px;max-width:300px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid #213652;border-bottom-color:#284463;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#15263d,#122239);box-shadow:0 -1px 0 rgba(255,255,255,.025) inset}.tab.active{background:linear-gradient(180deg,#192c46,#16263c)}.tabdot{width:8px;height:8px;border-radius:50%;background:#789ad0;box-shadow:0 0 0 3px rgba(120,154,208,.08)}.tabtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dbe6f5}.tabclose{width:24px;height:24px;border:0;border-radius:7px;background:transparent;color:#8da0b9;cursor:pointer;font-size:17px;line-height:1}.tabclose:hover{background:#223650;color:#fff}.newtab{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#98a9bf;font-size:22px;cursor:pointer}.newtab:hover{background:#172940;color:#eef5ff}.spacer{flex:1}.windowbtn{width:30px;height:28px;border:0;background:transparent;color:#7f93ab;border-radius:7px;cursor:pointer}.windowbtn:hover{background:#172940;color:#eef5ff}.tools{height:40px;display:flex;align-items:center;gap:7px}.tool{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#8ea2ba;display:grid;place-items:center;cursor:pointer;transition:.14s ease}.tool:hover{background:#172a43;color:#f0f5fb}.tool:active{transform:scale(.96)}.tool svg{width:17px;height:17px;stroke:currentColor}.addresswrap{height:34px;flex:1;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid #243a57;border-radius:11px;background:linear-gradient(180deg,#112138,#0f1d31);box-shadow:0 1px 0 rgba(255,255,255,.025) inset,0 3px 10px rgba(0,0,0,.12)}.addresswrap:focus-within{border-color:#416da5;box-shadow:0 0 0 3px rgba(76,128,201,.12)}.lock{width:15px;height:15px;color:#7794b7;flex:none}.address{width:100%;height:28px;background:transparent;border:0;outline:0;color:#edf4ff;font-size:13px}.address::placeholder{color:#70849d}.go{width:30px;height:28px;border:0;border-radius:8px;background:#1a314f;color:#a9c8f5;display:grid;place-items:center;cursor:pointer}.go:hover{background:#24456f;color:#e7f1ff}.go svg{width:15px;height:15px;stroke:currentColor}.menu{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#8ea2ba;display:grid;place-items:center;cursor:pointer}.menu:hover{background:#172a43;color:#fff}.menu svg{width:18px;height:18px;stroke:currentColor}.hint{display:none}</style></head><body><div class="chrome"><div class="top"><div class="brand"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M7 4h10l3 8-8 8-8-8 3-8Z"/><path d="M7 12h10"/></svg></span><span>GenişKapı</span></div><div class="tab active"><span class="tabdot"></span><span class="tabtitle" id="tabTitle">Yeni sekme</span><button class="tabclose" aria-label="Sekmeyi kapat">×</button></div><button class="newtab" id="new" aria-label="Yeni pencere">+</button><div class="spacer"></div><button class="windowbtn" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></div><div class="tools"><button class="tool" id="back" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><button class="tool" id="forward" aria-label="İleri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button><button class="tool" id="reload" aria-label="Yenile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0 2 5"/><path d="M20 5v6h-6"/></svg></button><button class="tool" id="home" aria-label="Ana sayfa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></button><div class="addresswrap"><svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input class="address" id="address" spellcheck="false" autocomplete="off" placeholder="Web'de ara veya adres gir"><button class="go" id="go" aria-label="Git"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg></button></div><button class="menu" aria-label="Daha fazla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg></button></div></div><script>const $=id=>document.getElementById(id);const icons={idle:'↻'};function navigate(){const value=$('address').value.trim();if(value)window.geniskapi.navigate(value)}$('go').onclick=navigate;$('address').addEventListener('keydown',e=>{if(e.key==='Enter')navigate();if(e.key==='Escape')e.target.blur()});$('back').onclick=()=>window.geniskapi.back();$('forward').onclick=()=>window.geniskapi.forward();$('reload').onclick=()=>window.geniskapi.reload();$('home').onclick=()=>window.geniskapi.home();$('new').onclick=()=>window.geniskapi.newWindow();window.geniskapi.onUrl(url=>{try{$('address').value=url;$('tabTitle').textContent=new URL(url).hostname.replace(/^www\./,'')||'Yeni sekme'}catch{$('address').value=url;$('tabTitle').textContent='GenişKapı'}});$('address').addEventListener('focus',e=>e.target.select());</script></body></html>
